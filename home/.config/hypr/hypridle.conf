# Idle timing follows the power profile (see ~/.local/bin/idle-step):
#                  screensaver   lock + screen off
#   power-saver       3 min           5 min
#   balanced          5 min          10 min
#   performance       7 min          15 min
# Coming back from the screensaver lands on the lock screen. Sleep after 20 idle minutes.
general {
    # Caelestia lock screen: touch the fingerprint reader or type your password
    lock_cmd = caelestia shell lock lock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}
# One listener per time any profile uses; idle-step only acts on the current profile's times
listener {
    timeout = 180
    on-timeout = ~/.local/bin/idle-step 180
    on-resume = ~/.local/bin/idle-step resume
}
listener {
    timeout = 300
    on-timeout = ~/.local/bin/idle-step 300
}
listener {
    timeout = 420
    on-timeout = ~/.local/bin/idle-step 420
}
listener {
    timeout = 600
    on-timeout = ~/.local/bin/idle-step 600
}
listener {
    timeout = 900
    on-timeout = ~/.local/bin/idle-step 900
}
listener {
    timeout = 1200
    on-timeout = systemctl suspend
}
