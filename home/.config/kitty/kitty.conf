# kitty terminal. Colors: Graphite dark (dark-theme.auto.conf, also used as the default).
# Reload after editing: Ctrl+Shift+F5

font_family      JetBrains Mono
font_size        11.0
symbol_map U+E000-U+F8FF,U+F0000-U+FFFFD Symbols Nerd Font Mono

window_padding_width 8

# Open at a normal size, centered, like GNOME apps (don't reuse the last size)
remember_window_size  no
initial_window_width  1000
initial_window_height 650
hide_window_decorations yes
confirm_os_window_close 0
enable_audio_bell no

cursor_shape beam
cursor_blink_interval 0

tab_bar_style     separator
tab_separator     " │ "
tab_bar_edge      top

scrollback_lines 10000
copy_on_select   no


# Touchpad scrolling speed (1.0 = kitty's normal; lower = slower). Mouse wheels aren't affected.
touch_scroll_multiplier 0.5
include dark-theme.auto.conf
