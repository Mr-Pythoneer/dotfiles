# Video: GPU-accelerated output + Intel Arc VA-API hardware decoding
vo=gpu-next
gpu-api=vulkan
hwdec=auto-safe
profile=high-quality
video-sync=display-resample
interpolation=no

# Behaviour
save-position-on-quit=yes
keep-open=yes
autofit-larger=90%x90%
cursor-autohide=1000
volume=100
volume-max=150

# Subtitles / audio language preference
slang=en,eng
alang=en,eng,jpn,ja
sub-auto=fuzzy

# Screenshots
screenshot-format=png
screenshot-dir=~/Pictures/Screenshots

# Online video quality cap (yt-dlp)
ytdl-format=bestvideo[height<=?1440]+bestaudio/best
